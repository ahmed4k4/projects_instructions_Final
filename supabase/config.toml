# Supabase CLI project config — safe defaults for local development.
# Run `supabase link --project-ref <ref>` before `supabase db push`.

project_id = "nexus-pc-builder"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = false

# JWT verification stays ON for the legacy Edge Function. The Vercel AI route
# accepts guest requests and applies an IP-hash quota, or a per-user quota when
# a valid Supabase access token is supplied.
[functions.gemini-proxy]
verify_jwt = true
